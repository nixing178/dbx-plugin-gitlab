name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR 门禁：main 的必需状态检查为 `web` 与 `backend`（见仓库 Ruleset）。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      # 发布时 sidecar 在 5 个原生 runner 上分别打包；这里提前用交叉编译守护
      # 非 Windows 平台的编译可移植性，避免发布当次才发现问题。
      - name: Cross-build (darwin/linux)
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            echo "::group::$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
            echo "::endgroup::"
          done
