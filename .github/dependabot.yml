version: 2
updates:
  # 前端依赖：pnpm（packageManager 已声明 10.11.0）
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TS 7（native 版）移除了 typescript/lib/tsc，vue-tsc 3.x 仍依赖该子路径
      - dependency-name: "typescript"
        versions: ["7.x"]
    groups:
      vue:
        patterns:
          - "vue"
          - "vue-tsc"
          - "@vue/*"
      tooling:
        patterns:
          - "vite"
          - "vitest"
          - "typescript"
          - "vite-plugin-*"

  # CI 依赖：Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
